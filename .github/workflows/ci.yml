name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for Cartopy
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full,test]"

      - name: Run tests
        run: pytest -q

      - name: Run self-test
        run: python scripts/ocean_plot.py --self-test

      - name: Render demo templates
        run: |
          python templates/map_panel_grid.py --demo
          python templates/mixed_panel_grid.py --demo

      - name: Upload demo figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: demo-figures
          path: figures/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distributions
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import glob, tarfile
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          required = [
              "SKILL.md",
              "docs/style-philosophy.md",
              "references/style-reference.md",
              "templates/map_panel_grid.py",
          ]
          missing = [name for name in required if not any(n.endswith(name) for n in names)]
          if missing:
              raise SystemExit(f"missing from sdist: {missing}")
          PY

      - name: Install wheel and smoke-test CLI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          /tmp/wheel-env/bin/ocean-plot --self-test

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
