[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanography-plotting-style"
version = "0.3.0"
description = "Publication-quality physical oceanography figures with Matplotlib, Cartopy and cmocean, packaged as a reusable Agent Skill."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Char0nChengg" }]
keywords = [
  "oceanography",
  "scientific-visualization",
  "matplotlib",
  "cartopy",
  "cmocean",
  "agent-skill",
  "deepseek-harness",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
]

[project.optional-dependencies]
full = [
  "cartopy>=0.22",
  "cmocean>=3.0",
  "xarray>=2023.1",
  "scipy>=1.10",
  "pandas>=2.0",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "pyyaml>=6",
  "pillow>=10",
]

[project.scripts]
ocean-plot = "ocean_plot:cli"

[project.urls]
Homepage = "https://github.com/Char0nChengg/oceanography-plotting-style"
Issues = "https://github.com/Char0nChengg/oceanography-plotting-style/issues"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
  "ocean_plot",
  "ocean_data",
  "ocean_vocab",
  "ocean_spectral",
  "ocean_journal",
  "ocean_access",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: renders a template and may download Natural Earth data",
]

[tool.coverage.run]
source = ["scripts"]
